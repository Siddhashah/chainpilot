version: '3.8'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string-in-production}
      MONGO_URI: mongodb://mongo:27017/chainpilot
      ML_SERVICE_URL: http://ml-service:8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      - mongo
      - ml-service

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8001/api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
